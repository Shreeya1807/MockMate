name: Quality gates
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mockmate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mockmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mockmate -d mockmate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/postgres.test.js
        env:
          TEST_DATABASE_URL: postgres://mockmate:ci-only-password@localhost:5432/mockmate_test
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report
            test-results
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 90
      - run: curl --fail http://localhost:3001/health/ready
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop isolated CI containers
        if: always()
        run: docker compose down -v
