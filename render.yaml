# Free web service with external persistent PostgreSQL storage.
services:
  - type: web
    name: mockmate
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: EVALUATION_MODE
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_DATABASE_URL
        value: '1'
      - key: WORKER_MODE
        value: embedded
      - key: TRUST_PROXY
        value: '1'
